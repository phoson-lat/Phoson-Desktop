  <text x="1400" y="19" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" fill="#8f86b3">21:43</text>

  <!-- Ventana: navegador con phoson.lat cargado -->
  <rect x="220" y="80" width="1000" height="680" rx="12" fill="#0f0b1a" stroke="#322a4d"/>
  <rect x="220" y="80" width="1000" height="60" rx="12" fill="#1e1830"/>
  <rect x="220" y="118" width="1000" height="22" fill="#1e1830"/>
