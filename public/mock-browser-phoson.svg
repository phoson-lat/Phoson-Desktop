  <text x="700" y="330" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="700" fill="#f2eefe">Tu agente autónomo,</text>
  <text x="700" y="382" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="700" fill="url(#hero)">en tu escritorio</text>
  <rect x="470" y="415" width="460" height="12" rx="6" fill="#3d3554"/>
  <rect x="520" y="440" width="360" height="12" rx="6" fill="#3d3554"/>

