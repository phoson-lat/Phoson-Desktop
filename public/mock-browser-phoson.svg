<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="wp3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150a2e"/>
      <stop offset=".55" stop-color="#1c0f3f"/>
      <stop offset="1" stop-color="#0a0618"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2eff"/>
