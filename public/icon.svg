<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" version="1.1">
  <defs>
    <!-- Gradiente para el brillo: Original con opacidades moderadas -->
    <radialGradient id="centerGlow" cx="250" cy="250" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a68cd1" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#a68cd1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a68cd1" stop-opacity="0"/>
    </radialGradient>

    <!-- Máscara de desvanecimiento para las líneas internas -->
    <radialGradient id="fadeGradient" cx="250" cy="250" r="85" gradientUnits="userSpaceOnUse">
      <stop offset="15%" stop-color="black"/>
      <stop offset="100%" stop-color="white"/>
    </radialGradient>

    <mask id="lineMask">
      <rect width="100%" height="100%" fill="white"/>
      <circle cx="250" cy="250" r="85" fill="url(#fadeGradient)"/>
    </mask>
  </defs>

  <!-- Fondo Blanco Circular -->
  <circle cx="250" cy="250" r="185" fill="white"/>

  <!-- Círculo Exterior Gris Oscuro -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#d0d0d0" stroke-width="1.5"/>

  <!-- HEXÁGONO EXTERIOR (Violeta oscuro y saturado) -->
  <polygon points="250,120 362.6,185 362.6,315 250,380 137.4,315 137.4,185" fill="none" stroke="#280854" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- LÍNEAS INTERNAS PRINCIPALES -->
  <g stroke="#280854" stroke-width="1.5" mask="url(#lineMask)">
    <line x1="250" y1="120" x2="250" y2="380"/>
    <line x1="137.4" y1="185" x2="362.6" y2="315"/>
    <line x1="137.4" y1="315" x2="362.6" y2="185"/>
  </g>

  <!-- BRILLO CENTRAL -->
  <circle cx="250" cy="250" r="90" fill="url(#centerGlow)"/>

  <!-- DESTELLOS CORTOS (Violeta saturado) -->
  <g stroke="#9176b8" stroke-width="1.5" stroke-linecap="round">
    <line x1="285" y1="250" x2="315" y2="250"/>
    <line x1="215" y1="250" x2="185" y2="250"/>
    <line x1="267.5" y1="219.7" x2="282.5" y2="193.7"/>
    <line x1="232.5" y1="219.7" x2="217.5" y2="193.7"/>
    <line x1="267.5" y1="280.3" x2="282.5" y2="306.3"/>
    <line x1="232.5" y1="280.3" x2="217.5" y2="306.3"/>
  </g>

  <!-- ESTRELLA CENTRAL (Violeta saturado) -->
  <path d="M 250,223 
           Q 250,250 277,250 
           Q 250,250 250,277 
           Q 250,250 223,250 
           Q 250,250 250,223 Z" fill="#967bbf"/>
</svg>
