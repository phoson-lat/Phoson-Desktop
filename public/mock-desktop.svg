  <g>
    <rect x="460" y="848" width="40" height="40" rx="10" fill="#2a2340"/>
    <rect x="524" y="848" width="40" height="40" rx="10" fill="#2a2340"/>
    <rect x="588" y="848" width="40" height="40" rx="10" fill="#2a2340"/>
    <rect x="652" y="848" width="40" height="40" rx="10" fill="#5b2eff"/>
    <circle cx="672" cy="868" r="11" fill="none" stroke="#fff" stroke-width="2.5" opacity=".9"/>
    <rect x="716" y="848" width="40" height="40" rx="10" fill="#2a2340"/>
    <rect x="780" y="848" width="40" height="40" rx="10" fill="#2a2340"/>
    <rect x="844" y="848" width="40" height="40" rx="10" fill="#2a2340"/>
    <rect x="908" y="848" width="40" height="40" rx="10" fill="#2a2340"/>
