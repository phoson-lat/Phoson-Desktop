<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="wp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150a2e"/>
      <stop offset=".55" stop-color="#1c0f3f"/>
      <stop offset="1" stop-color="#0a0618"/>
    </linearGradient>
    <radialGradient id="nebula" cx=".7" cy=".25" r=".8">
      <stop offset="0" stop-color="#5b2eff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#2b0a57" stop-opacity=".25"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1626"/>
      <stop offset="1" stop-color="#131020"/>
    </linearGradient>
    <linearGradient id="code1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#7c5cff" stop-opacity=".2"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1440" height="900" fill="url(#wp)"/>
  <rect width="1440" height="900" fill="url(#nebula)"/>
  <circle cx="1150" cy="180" r="120" fill="#6d3ff7" opacity=".12"/>
  <circle cx="240" cy="640" r="160" fill="#2b0a57" opacity=".35"/>

  <!-- Barra de menú -->
  <rect width="1440" height="28" fill="#0d0917" opacity=".85"/>
  <text x="20" y="19" font-family="-apple-system, sans-serif" font-size="13" fill="#cfc8e8" font-weight="600"> Finder</text>
  <text x="1400" y="19" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" fill="#8f86b3">21:42</text>

  <!-- Ventana: editor -->
  <rect x="150" y="90" width="860" height="560" rx="12" fill="url(#win)" stroke="#322a4d"/>
  <rect x="150" y="90" width="860" height="40" rx="12" fill="#211b33"/>
  <rect x="150" y="112" width="860" height="18" fill="#211b33"/>
  <circle cx="176" cy="110" r="6" fill="#ff5f57"/><circle cx="196" cy="110" r="6" fill="#febc2e"/><circle cx="216" cy="110" r="6" fill="#28c840"/>
  <text x="580" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#8f86b3">phoson — engine.ts</text>

  <!-- Sidebar del editor -->
  <rect x="150" y="130" width="180" height="520" fill="#171226"/>
  <g fill="#3d3554">
    <rect x="168" y="150" width="130" height="10" rx="5"/>
    <rect x="168" y="172" width="100" height="10" rx="5"/>
    <rect x="168" y="194" width="120" height="10" rx="5"/>
    <rect x="168" y="216" width="86" height="10" rx="5"/>
    <rect x="168" y="238" width="112" height="10" rx="5"/>
  </g>

  <!-- Código -->
  <g>
    <rect x="360" y="160" width="240" height="12" rx="6" fill="url(#code1)"/>
    <rect x="384" y="186" width="330" height="12" rx="6" fill="#34d399" opacity=".55"/>
    <rect x="384" y="212" width="180" height="12" rx="6" fill="#8f86b3" opacity=".5"/>
    <rect x="408" y="238" width="290" height="12" rx="6" fill="#6ea8fe" opacity=".5"/>
    <rect x="408" y="264" width="150" height="12" rx="6" fill="#f2b8ff" opacity=".45"/>
    <rect x="384" y="290" width="220" height="12" rx="6" fill="#8f86b3" opacity=".5"/>
    <rect x="360" y="316" width="120" height="12" rx="6" fill="url(#code1)"/>
    <rect x="384" y="342" width="300" height="12" rx="6" fill="#34d399" opacity=".4"/>
    <rect x="384" y="368" width="190" height="12" rx="6" fill="#8f86b3" opacity=".45"/>
    <rect x="360" y="394" width="90" height="12" rx="6" fill="url(#code1)"/>
    <!-- caret -->
    <rect x="470" y="392" width="8" height="16" fill="#a78bfa"/>
