[project]
name = "phoson-bridge"
version = "0.1.0"
description = "Sidecar JSON-RPC (stdio) que expone phoson-engine-minimal a Phoson Desktop"
requires-python = ">=3.12"
dependencies = [
    "phoson-engine-minimal>=0.50.1",
]

[project.optional-dependencies]
# Extras instalados en el venv del sidecar (empaquetado con PyInstaller).
# `bundle` agrupa los plugins que van DENTRO del binario de escritorio; los
# plugins bgjobs/monitor/swarm ya vienen en el paquete base del engine.
mcp = ["phoson-engine-minimal[mcp]"]
stt = ["phoson-engine-minimal[stt]"]
checkpoint = ["phoson-engine-minimal[checkpoint]"]
bundle = [
    "phoson-engine-minimal[mcp,stt,checkpoint]",
]

[project.scripts]
phoson-bridge = "phoson_bridge.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phoson_bridge"]
