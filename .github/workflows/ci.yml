name: ci

# Comprobaciones rápidas en cada push/PR: typecheck + build del frontend.
# (El empaquetado multiplataforma vive en release.yml.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: deps
        run: pnpm install --frozen-lockfile

      - name: unit tests
        run: pnpm test:unit

      - name: typecheck + build
        run: pnpm build

      # Paridad de claves es/en, placeholders y textos sin traducir en la UI.
      - name: i18n
        run: pnpm check:i18n -- --list

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: instalar deps del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      # `cargo check` sin el binario del sidecar (la config de release no se usa aquí).
      - name: cargo check (src-tauri)
        working-directory: src-tauri
        run: cargo check --locked

      - name: tests de Rust
        working-directory: src-tauri
        run: cargo test --locked

  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar bridge y dependencias de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./bridge[test]"

      - name: compilar el sidecar (sintaxis)
        run: python -m py_compile bridge/phoson_bridge/*.py

      - name: tests pytest del sidecar
        run: >-
          python -m pytest -q
          bridge/tests/test_engine_api.py
          bridge/tests/test_plugin_blocks.py
          bridge/tests/test_peers.py
          bridge/tests/test_questions.py
          bridge/tests/test_token_batch.py
          bridge/tests/test_wake_turns.py
          bridge/tests/test_watchdog_models.py

      # Estos arneses anteriores son scripts con aserciones al importar; se
      # ejecutan en procesos separados para aislar HOME y los mocks globales.
      - name: arneses del sidecar
        run: |
          for test in test_extras.py test_plugins.py test_stt_config.py test_stt_download.py test_stt_engine.py test_stt_transcribe.py; do
            python "bridge/tests/$test" || exit 1
          done

      - name: integración JSON-RPC (sin LLM)
        working-directory: bridge
        env:
          HOME: ${{ runner.temp }}/phoson-home
          USERPROFILE: ${{ runner.temp }}/phoson-home
          PHOSON_PROVIDER: ollama
          PHOSON_MODEL: test-model
        run: python tests/smoke.py
