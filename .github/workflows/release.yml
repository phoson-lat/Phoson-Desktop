name: release

# Publica un release multiplataforma al empujar un tag `v*` (p. ej. v0.1.0-alpha.1).
# También se puede lanzar a mano desde la UI de Actions (workflow_dispatch).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cada runner construye su propio binario: no hay cross-compilación de
          # PyInstaller, así que se usa el host como target.
          - platform: ubuntu-22.04 # x86_64-unknown-linux-gnu
          - platform: windows-latest # x86_64-pc-windows-msvc
          - platform: macos-14 # aarch64-apple-darwin (Apple Silicon)
          # macOS Intel (macos-13) queda fuera: los runners Intel son escasos y
          # el updater serviría un set incompleto. Se puede reactivar cuando haya
          # disponibilidad (añade `- platform: macos-13`).
    runs-on: ${{ matrix.platform }}

    steps:
      - name: checkout (app)
        uses: actions/checkout@v4

      # El engine se instala desde su repo etiquetado (la app lo fija por versión
      # en bridge/pyproject.toml). Cámbialo aquí cuando subas el pin.
      - name: checkout (engine)
        uses: actions/checkout@v4
        with:
          repository: phoson-lat/phoson-engine-minimal
          ref: v0.57.1
          path: engine

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar deps del sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libportaudio2: el wheel de sounddevice NO trae PortAudio en Linux, así
          # que sin él `--stt-check` del build avisa que el sidecar sale sin dictado
          # (y hook-sounddevice no tiene .so que meter en el congelado).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 libportaudio2

      - name: deps del frontend
        run: pnpm install --frozen-lockfile

      # `linuxdeploy` (AppImage) se ejecuta como AppImage: sin FUSE hay que
      # extraerlo. Evita el panic de appimagetool en los runners.
      - name: configurar entorno de bundling
        shell: bash
        run: echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # Crea el venv del engine, instala el engine + extras y compila el sidecar
      # onedir (src-tauri/binaries/phoson-bridge/), que tauri-action empaqueta
      # como recurso del bundle (bundle.resources de tauri.release.conf.json).
      - name: compilar el sidecar
        shell: bash
        run: |
          set -euo pipefail
          python -m venv engine/.venv
          if [ -x engine/.venv/bin/python ]; then
            PY="$PWD/engine/.venv/bin/python"
          else
            PY="$PWD/engine/.venv/Scripts/python.exe"
          fi
          "$PY" -m pip install --upgrade pip
          # Engine en editable (base). Los extras nativos (moonshine) los
          # instala el script de build, best-effort por plataforma.
          "$PY" -m pip install -e "./engine"
          PHOSON_ENGINE_DIR="$PWD/engine" bash scripts/build-sidecar.sh

      # Windows: Authenticode para el ejecutable y el instalador NSIS. El PFX
      # vive solo en el runner temporal; la huella se deriva del certificado y
      # se inyecta en la config de release sin versionarla. Sin certificado el
      # build sigue disponible, pero SmartScreen/Smart App Control puede bloquearlo.
      - name: Windows — importar certificado Authenticode
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          IN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          IN_CERT_PW: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          IN_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          IN_TIMESTAMP: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:IN_CERT)) {
            Write-Host "::warning title=Windows sin certificado::WINDOWS_CERTIFICATE no configurado: el instalador quedará sin firmar y SmartScreen puede bloquearlo."
            exit 0
          }

          $certDir = Join-Path $env:RUNNER_TEMP "phoson-authenticode"
          $pfx = Join-Path $certDir "certificate.pfx"
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          try {
            # Acepta base64 con o sin saltos de línea (certutil/openssl).
            $bytes = [Convert]::FromBase64String(($env:IN_CERT -replace '\s', ''))
            [IO.File]::WriteAllBytes($pfx, $bytes)
            $password = ConvertTo-SecureString -String "$env:IN_CERT_PW" -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $thumbprint = if ([string]::IsNullOrWhiteSpace($env:IN_THUMBPRINT)) { $cert.Thumbprint } else { $env:IN_THUMBPRINT }
            $timestamp = if ([string]::IsNullOrWhiteSpace($env:IN_TIMESTAMP)) { "http://timestamp.digicert.com" } else { $env:IN_TIMESTAMP }

            $configPath = "src-tauri/tauri.release.conf.json"
            $config = Get-Content $configPath -Raw | ConvertFrom-Json
            if ($null -eq $config.bundle.windows) {
              $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{})
            }
            $config.bundle.windows | Add-Member -Force -NotePropertyName certificateThumbprint -NotePropertyValue $thumbprint
            $config.bundle.windows | Add-Member -Force -NotePropertyName digestAlgorithm -NotePropertyValue "sha256"
            $config.bundle.windows | Add-Member -Force -NotePropertyName timestampUrl -NotePropertyValue $timestamp
            $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8
            "WINDOWS_SIGNING_REQUIRED=true" >> $env:GITHUB_ENV
            Write-Host "Certificado importado; Tauri firmará con Authenticode SHA-256 y timestamp."
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }

      # macOS: un bundle SIN firma válida se descarga con cuarentena y macOS 26
      # lo muestra como "Phoson Desktop está dañado y no se puede abrir" (no hay
      # botón para autorizarlo). Con `APPLE_SIGNING_IDENTITY=-` Tauri firma
      # ad-hoc: la firma pasa a ser válida y el usuario solo debe autorizarla en
      # Ajustes → Privacidad y seguridad (comportamiento esperado en ARM).
      #
      # Se aplica ad-hoc SOLO si no hay certificado, y las variables se exportan
      # por GITHUB_ENV (no en el `env:` de tauri-action) para no dejar
      # `APPLE_CERTIFICATE` definida y vacía: el bundler la leería como presente
      # e intentaría importar un certificado vacío.
      - name: macOS — configurar firma (ad-hoc si no hay certificado)
        if: matrix.platform == 'macos-14'
        shell: bash
        env:
          IN_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          IN_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_CERT_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${IN_CERT:-}" ]; then
            {
              echo "APPLE_CERTIFICATE=$IN_CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$IN_CERT_PW"
              [ -n "${IN_CERT_ID:-}" ] && echo "APPLE_SIGNING_IDENTITY=$IN_CERT_ID"
              [ -n "${IN_APPLE_ID:-}" ] && echo "APPLE_ID=$IN_APPLE_ID"
              [ -n "${IN_APPLE_PW:-}" ] && echo "APPLE_PASSWORD=$IN_APPLE_PW"
              [ -n "${IN_APPLE_TEAM:-}" ] && echo "APPLE_TEAM_ID=$IN_APPLE_TEAM"
            } >> "$GITHUB_ENV"
            echo "Firma con Developer ID + notarización (si APPLE_ID/APPLE_TEAM_ID están definidos)."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning title=macOS sin certificado::APPLE_CERTIFICATE no configurado: se firma ad-hoc. Los usuarios deberán autorizar la app en Ajustes → Privacidad y seguridad."
          fi

      # tauri-action compila la app con la config de release (sidecar onedir como
      # `bundle.resources` + createUpdaterArtifacts), firma y sube los bundles +
      # latest.json al release.
      - name: build + release (tauri-action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Phoson Desktop v__VERSION__"
          # Este texto queda DENTRO de latest.json (`notes`), así que es lo que
          # el updater enseña en Ajustes → Acerca de: va en inglés y sin datos
          # de una versión concreta (los detalles, por release, se escriben en
          # el cuerpo del release con `gh release edit --notes-file` tras
          # publicarlo; ver RELEASE.md).
          releaseBody: |
            Alpha build of Phoson Desktop. Download the bundle for your platform from this release;
            if you already have a previous alpha installed, the app offers the update automatically.
            macOS uses Developer ID/notarization when configured, or ad-hoc signing otherwise.
            Windows uses Authenticode when a certificate is configured; unsigned builds may trigger SmartScreen.
          releaseDraft: true
          # NO marcar como *prerelease*: el updater lee
          # `releases/latest/download/latest.json` y `/releases/latest` excluye
          # los prereleases, así que el release quedaría invisible para la app
          # (sin error visible: seguiría ofreciendo la versión anterior) hasta
          # que alguien lo marcara a mano. La versión `0.1.0-alpha.N` ya indica
          # que es un alpha. Ver DISTRIBUTION.md §3.
          prerelease: false
          args: "--config src-tauri/tauri.release.conf.json"

      - name: Windows — verificar la firma del instalador
        if: matrix.platform == 'windows-latest' && env.WINDOWS_SIGNING_REQUIRED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($installers.Count -eq 0) { throw "No se encontró el instalador NSIS" }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Firma inválida en $($installer.Name): $($signature.Status) — $($signature.StatusMessage)"
            }
            Write-Host "Firma Authenticode válida: $($installer.Name)"
          }
